name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked pm project health
        # The script fails on the SDK's authoritative ok predicate, including
        # history, integrity and extension failures, without requiring Git setup.
        run: npm run tracker:health

      - name: Verify commit identities and private path policy
        run: npm run identity:check

      - name: Build package
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Duplication gate
        run: npm run duplication

      - name: Verify complete docstring coverage
        run: npm run docstring

      - name: Test with coverage gate
        run: npm run coverage

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Verify npm package contents
        run: npm run pack:dry-run

      - name: Verify generated changelog
        run: npm run changelog:check

      - name: Verify every publish invocation is attested
        run: npm run verify:release-publish-attestation

      - name: Verify Bun can install the package graph
        run: bun install --no-save

      - name: Packed npm and Bun acceptance
        run: npm run test:install

      - name: Bun release gates
        if: matrix.node-version == 26
        run: bun run release:check
